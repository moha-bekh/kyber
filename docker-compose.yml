# Run the Kyber documentation site locally:
#   docker compose up           -> dev server with hot-reload at http://localhost:3000
#   docker compose run --rm site npm run build   -> produce a static site under ./build
services:
  site:
    build: .
    image: kyber-doc:dev
    ports:
      - "3000:3000"
    volumes:
      # Mount the source so edits on the host trigger hot-reload inside the container.
      - .:/site
      # Keep node_modules and the docusaurus cache inside the container — host paths
      # would shadow the npm-installed dependencies and break the build.
      - site-node-modules:/site/node_modules
      - site-docusaurus-cache:/site/.docusaurus
    environment:
      # Polling-based file watching plays nicer with bind-mounts than inotify.
      CHOKIDAR_USEPOLLING: "true"
    stdin_open: true
    tty: true

volumes:
  site-node-modules:
  site-docusaurus-cache:
