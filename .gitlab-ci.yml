# GitLab CI for the Kyber documentation site.
# Builds the Docusaurus static site and publishes it to GitLab Pages.
#
# GitLab Pages requires the job to be named `pages` and to upload its output
# under `public/`. Docusaurus writes to `build/`, so we rename it before
# declaring the artifact.

image: node:22-alpine

# Speed up CI by reusing the npm cache across runs on the same branch.
cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

stages:
  - deploy

pages:
  stage: deploy
  tags:
    - docker
  script:
    - npm ci --cache .npm --prefer-offline
    - npx docusaurus build
    - rm -rf public
    - mv build public
  artifacts:
    paths:
      - public
    expire_in: 1 week
  # Publish only from the default branch — feature branches don't overwrite Pages.
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
